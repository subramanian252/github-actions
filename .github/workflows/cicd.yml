name: CI/CD Pipeline

on: push


jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -la
          hostname
      - name: step-2
        uses: actions/checkout@v6.1.0
      - name: step-3
        run : |
          pwd
          mkdir artifacts
          ls -la >> artifacts/listing.txt
          echo "note" >> ./note.txt
          hostname >> artifacts/hostname.txt
      - name: step-4
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_artifacts
          path: ./note.txt
      - name: step-5
        uses: actions/upload-artifact@v7.0.1
        with:
          name: directory_artifacts
          path: artifacts/
      - name: step-6
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multi_path_artifacts
          path: |
            ./note.txt
            ./artifacts/
      - name : step-7
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all_files
          path: |
            ./note.txt
            ./artifacts/
            !**/hostname.txt
  job2:
    name: job2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: step-1
        run: |
          pwd
          ls -la
          hostname
      - name : download a file
        uses: actions/download-artifact@v5
        with:
          name: single_artifacts
      - name: verify download
        run: |
          ls -la
          cat ./note.txt
          
          
          



          
          


